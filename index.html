<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌺沖縄クイズ🌺 初級編</title>

    <style>
        :root {
            --primary-color: #ee5253; /* 首里城の赤瓦（朱色） */
            --secondary-color: #10ac84; /* 沖縄の美しい海（エメラルド） */
            --accent-color: #ff9f43; /* シークヮーサー・お日様のオレンジ */
            --bg-color: #f7f9f9;
        }

        body { 
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif; 
            background: linear-gradient(135deg, #eccc68 0%, #ff7f50 50%, #7bed9f 100%); 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            min-height: 95vh; 
            margin: 0; 
        }

        .container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 35px 25px; 
            border-radius: 20px; 
            box-shadow: 0 12px 30px rgba(0,0,0,0.15); 
            width: 100%; 
            max-width: 480px; 
            text-align: center; 
            box-sizing: border-box;
            border: 4px solid var(--accent-color);
            position: relative;
        }

        .container::before {
            content: "■■■■ ■■■";
            position: absolute;
            top: 8px;
            left: 0;
            width: 100%;
            font-size: 10px;
            letter-spacing: 4px;
            color: var(--primary-color);
            opacity: 0.3;
        }

        .main-title { color: var(--primary-color); margin-bottom: 5px; font-size: 28px; font-weight: bold; }
        .sub-title { color: #2c3e50; margin-top: 0; margin-bottom: 25px; font-size: 20px; font-weight: bold; }
        h2 { color: #2c3e50; margin-bottom: 20px; font-size: 22px; }
        h3 { color: var(--secondary-color); margin-top: 25px; margin-bottom: 10px; font-size: 18px; border-bottom: 2px dashed var(--secondary-color); padding-bottom: 5px; }
        p { color: #57606f; font-size: 15px; line-height: 1.6; margin: 10px 0; }
        
        .input-group { margin: 20px 0; text-align: left; }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #2c3e50; font-size: 14px; }
        
        input[type="text"] { 
            width: 100%; 
            padding: 14px; 
            border: 2px solid #c8d6e5; 
            border-radius: 10px; 
            font-size: 16px; 
            box-sizing: border-box; 
            transition: border-color 0.2s; 
        }
        input[type="text"]:focus { border-color: var(--secondary-color); outline: none; }
        
        .btn { 
            display: block; 
            width: 100%; 
            padding: 14px; 
            margin: 12px 0; 
            background: var(--primary-color); 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: transform 0.1s, background 0.2s; 
            box-shadow: 0 4px 10px rgba(238, 82, 83, 0.3);
        }
        .btn:hover { background: #d63031; transform: translateY(-1px); }
        .btn:active { transform: translateY(1px); }
        
        .choice-btn { background: #f1f2f6; color: #2c3e50; text-align: left; font-weight: normal; box-shadow: none; border: 1px solid #c8d6e5; }
        .choice-btn:hover { background: #e6f7f4; border-color: var(--secondary-color); color: var(--secondary-color); font-weight: bold; }
        
        .btn-share { background: #000000; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .btn-share:hover { background: #2f3542; }
        
        .btn-sub { background: var(--secondary-color); box-shadow: 0 4px 10px rgba(16,172,132,0.3); }
        .btn-sub:hover { background: #0e9aa7; }

        .hidden { display: none; }
        
        .info-bar { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 20px; 
            font-weight: bold; 
            color: #57606f; 
            border-bottom: 3px double var(--accent-color); 
            padding-bottom: 10px; 
        }
        
        ul { list-style: none; padding: 0; margin: 15px 0; text-align: left; }
        li { padding: 12px; border-bottom: 1px dashed #c8d6e5; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
        li:nth-child(1) { background: #fff2cc; font-weight: bold; color: #d63031; border-radius: 8px; border: 1px solid var(--accent-color); }
        
        .scroll-list { max-height: 250px; overflow-y: auto; border: 1px solid #c8d6e5; border-radius: 10px; background: #fafafa; padding: 5px; }
        .scroll-list li:nth-child(1) { background: none; font-weight: normal; color: inherit; border: none; border-radius: 0; }
        
        .loading { font-size: 18px; color: var(--secondary-color); font-weight: bold; margin: 20px 0; }
        
        footer { 
            margin-top: 20px; 
            font-size: 12px; 
            color: rgba(255, 255, 255, 0.9); 
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2); 
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <div id="loading-screen">
        <div class="loading">🌺 クイズデータを読み込み中さぁ...</div>
    </div>

    <div id="start-screen" class="hidden">
        <div class="main-title">🌺沖縄クイズ🌺</div>
        <div class="sub-title">初級編</div>
        <p>全100問の中からランダムに10問が出題されるさぁ。<br>正解数とクリアタイムで上位を目指そう！</p>
        <div class="input-group">
            <label for="username">挑戦者の名前（ログネーム）</label>
            <input type="text" id="username" placeholder="名前を入れないと自動で決まるさぁ" maxlength="10">
        </div>
        <button class="btn" onclick="startQuiz()">クイズを始める</button>
        
        <h3>🏆 トップ10 ランキング</h3>
        <ul id="ranking-list"></ul>
        
        <button class="btn btn-sub" onclick="showOverallRankingScreen('start-screen')">今までの挑戦者ランキングを見る</button>
    </div>

    <div id="quiz-screen" class="hidden">
        <div class="info-bar">
            <span id="question-number">第 1 問</span>
            <span id="live-timer">タイム: 0.0秒</span>
        </div>
        <h2 id="question-text">問題文</h2>
        <div id="choices-container"></div>
    </div>

    <div id="result-screen" class="hidden">
        <h2>🎉 結果発表</h2>
        <p id="score-text">10問中 0問正解！</p>
        <p id="time-text">クリアタイム: 0秒</p>
        
        <button class="btn btn-share" onclick="shareOnX()">𝕏 で結果をシェアする</button>
        
        <button class="btn btn-sub" onclick="showOverallRankingScreen('result-screen')">総合ランキングを見る</button>
        
        <button class="btn" style="background: #74b9ff; box-shadow: 0 4px 10px rgba(116,185,255,0.3);" onclick="resetToStart()">トップに戻る</button>
    </div>

    <div id="overall-ranking-screen" class="hidden">
        <h2>📊 今までの全挑戦者記録</h2>
        <p>これまでにクイズに挑戦したすべての人のスコア一覧さぁ！</p>
        <div class="scroll-list">
            <ul id="overall-ranking-list"></ul>
        </div>
        <button id="back-btn" class="btn" style="background: var(--accent-color); box-shadow: 0 4px 10px rgba(255,159,67,0.3);">戻る</button>
    </div>
</div>

<footer>
    &copy; 2026 沖縄クイズアプリ. All Rights Reserved.
</footer>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbxWPC119iBNQTPKVquEFGF5o1PZjPVy8naDANafjZZVJUmks1vghljzQUA8peDM1RtH5Q/exec";

let quizBank = [];
let currentQuestions = [];
let currentQuestionIndex = 0;
let score = 0;
let userName = "";

let startTime = 0;
let timerInterval = null;
let finalTime = 0;
let allRankings = []; 
let previousScreenId = "start-screen"; 

const okinawaNames = ["シーサーんちゅ", "ゴーヤーマン", "ちんすこう王", "オリオンじょーぐー", "ハイサイくん", "めんそーれ姫", "ゆいレール丸", "ガじゅまる精霊", "アグーピッグ", "マース大佐"];

window.addEventListener("DOMContentLoaded", () => {
    const savedName = localStorage.getItem("quiz_log_name");
    if (savedName) {
        document.getElementById("username").value = savedName;
    }

    fetch(GAS_URL)
        .then(response => response.json())
        .then(data => {
            quizBank = data.questions;
            allRankings = data.rankings;
            displayTop10Ranking(data.rankings);
            changeScreen("loading-screen", "start-screen");
        })
        .catch(error => {
            console.error("データ取得エラー:", error);
            document.getElementById("loading-screen").innerHTML = "<p style='color:red;'>データの読み込みに失敗しました。</p>";
        });
});

function startQuiz() {
    let inputName = document.getElementById("username").value.trim();
    if (!inputName) {
        const randomIndex = Math.floor(Math.random() * okinawaNames.length);
        inputName = okinawaNames[randomIndex];
    }
    userName = inputName;
    localStorage.setItem("quiz_log_name", userName);

    currentQuestions = [...quizBank].sort(() => 0.5 - Math.random()).slice(0, 10);
    currentQuestionIndex = 0;
    score = 0;
    
    changeScreen("start-screen", "quiz-screen");
    
    startTime = performance.now();
    timerInterval = setInterval(() => {
        const elapsed = (performance.now() - startTime) / 1000;
        document.getElementById("live-timer").innerText = `タイム: ${elapsed.toFixed(1)}秒`;
    }, 100);

    showQuestion();
}

function showQuestion() {
    const qData = currentQuestions[currentQuestionIndex];
    document.getElementById("question-number").innerText = `第 ${currentQuestionIndex + 1} 問 / 全 10 問`;
    document.getElementById("question-text").innerText = qData.q;
    
    const choicesContainer = document.getElementById("choices-container");
    choicesContainer.innerHTML = "";
    
    const shuffledChoices = [...qData.c].sort(() => 0.5 - Math.random());
    
    shuffledChoices.forEach(choice => {
        const button = document.createElement("button");
        button.innerText = choice;
        button.classList.add("btn", "choice-btn");
        button.onclick = () => handleAnswer(choice);
        choicesContainer.appendChild(button);
    });
}

function handleAnswer(selected) {
    const qData = currentQuestions[currentQuestionIndex];
    if (selected === qData.a) {
        score++;
    }
    
    currentQuestionIndex++;
    if (currentQuestionIndex < currentQuestions.length) {
        showQuestion();
    } else {
        endQuiz();
    }
}

function endQuiz() {
    clearInterval(timerInterval); 
    finalTime = ((performance.now() - startTime) / 1000).toFixed(2); 

    document.getElementById("score-text").innerText = `10問中 ${score}問正解！`;
    document.getElementById("time-text").innerText = `クリアタイム: ${finalTime}秒`;
    
    changeScreen("quiz-screen", "loading-screen");
    document.getElementById("loading-screen").innerHTML = "<div class='loading'>ランキングに記録を送信中さぁ...</div>";

    const payload = {
        name: userName,
        score: score,
        time: parseFloat(finalTime)
    };

    fetch(GAS_URL, {
        method: "POST",
        body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
        allRankings = data.rankings;
        displayTop10Ranking(data.rankings); 
        changeScreen("loading-screen", "result-screen");
    })
    .catch(error => {
        console.error("スコア送信エラー:", error);
        changeScreen("loading-screen", "result-screen");
    });
}

function displayTop10Ranking(rankings) {
    const list = document.getElementById("ranking-list");
    list.innerHTML = "";
    
    if(!rankings || rankings.length === 0) {
        list.innerHTML = "<li>ランキングデータはまだありません。一番乗りを目指そう！</li>";
        return;
    }

    rankings.slice(0, 10).forEach((item, index) => {
        const li = document.createElement("li");
        li.innerHTML = `
            <span>第 ${index + 1} 位: <strong>${item.name}</strong></span> 
            <span>${item.score}点 (${item.time}秒)</span>
        `;
        list.appendChild(li);
    });
}

function showOverallRankingScreen(currentScreenId) {
    previousScreenId = currentScreenId; 
    const list = document.getElementById("overall-ranking-list");
    list.innerHTML = "";
    
    if(!allRankings || allRankings.length === 0) {
        list.innerHTML = "<li>挑戦者のデータはまだ登録されていません。</li>";
    } else {
        allRankings.forEach((item, index) => {
            const li = document.createElement("li");
            li.style.display = "flex";
            li.style.justify = "space-between";
            li.style.padding = "10px";
            li.style.borderBottom = "1px solid #eee";
            li.innerHTML = `
                <span>${index + 1}. <strong>${item.name}</strong></span> 
                <span>${item.score}点 (${item.time}秒)</span>
            `;
            list.appendChild(li);
        });
    }
    
    document.getElementById("back-btn").onclick = () => {
        changeScreen("overall-ranking-screen", previousScreenId);
    };
    
    changeScreen(currentScreenId, "overall-ranking-screen");
}

function shareOnX() {
    const text = encodeURIComponent(`🌺【沖縄クイズ 初級編】に挑戦したさぁ！\n結果：10問中 ${score}問正解！\nクリアタイム：${finalTime}秒\n\n挑戦したい方は下記のURLから👇\n`);
    const targetUrl = encodeURIComponent("https://karimatamasaru.github.io/okinawa-quiz/");
    const hashtags = encodeURIComponent("沖縄クイズ,初級");
    const shareUrl = `https://twitter.com/intent/tweet?text=${text}&hashtags=${hashtags}&url=${targetUrl}`;
    window.open(shareUrl, '_blank');
}

function changeScreen(hideId, showId) {
    document.getElementById(hideId).classList.add("hidden");
    document.getElementById(showId).classList.remove("hidden");
}

function resetToStart() {
    changeScreen("result-screen", "start-screen");
    const savedName = localStorage.getItem("quiz_log_name");
    if (savedName) {
        document.getElementById("username").value = savedName;
    }
    document.getElementById("loading-screen").innerHTML = "<div class='loading'>🌺 クイズデータを読み込み中さぁ...</div>";
}
</script>
</body>
</html>
